# Pixel 10 Pro. Android Expo Go restores the active route on cold launch.
# Level 2 tiles: დ top, ე upper right (seven tiles on a 128 dp orbit).
appId: host.exp.Exponent
---
- stopApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'ოჯახი'
    timeout: 30000
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- assertVisible: '125 მონეტა'
- swipe:
    start: 50%, 51%
    end: 73%, 56%
    duration: 700
- assertVisible: 'დე, ეს სიტყვა აქ არ არის'
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- assertVisible: '125 მონეტა'
- takeScreenshot: artifacts/android-restart-restored
