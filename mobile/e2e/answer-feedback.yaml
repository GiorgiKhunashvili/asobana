# Run after drag.yaml on a first-level save with only მე found.
appId: host.exp.Exponent
---
- assertVisible: '100 მონეტა · 1/2 სიტყვა · Bonus 0'
- swipe:
    start: 50%, 52%
    end: 27%, 70%
    duration: 700
- assertVisible: 'ეს სიტყვა უკვე ნაპოვნია · Already found'
- assertVisible: '100 მონეტა · 1/2 სიტყვა · Bonus 0'
- swipe:
    start: 27%, 70%
    end: 50%, 52%
    duration: 700
- assertVisible: 'სცადე კიდევ · Try again'
- assertVisible: '100 მონეტა · 1/2 სიტყვა · Bonus 0'
- tapOn: 'Tap mode'
- scrollUntilVisible:
    element: 'Submit'
    direction: DOWN
- tapOn: 'მ · 1'
- tapOn: 'ზ · 2'
- tapOn: 'ე · 3'
- tapOn: 'Submit'
- assertVisible: '125 მონეტა · 2/2 სიტყვა · Bonus 0'
- assertVisible: 'დონე დასრულებულია · Level completed'
- takeScreenshot: artifacts/ios-level-1-completed
- tapOn: 'გილოცავ! · Victory'
- tapOn: 'შემდეგი დონე · Next level'
- assertVisible: 'ოჯახი'
- assertVisible: '125 მონეტა · 0/2 სიტყვა · Bonus 0'
- takeScreenshot: artifacts/ios-level-2-unlocked
