# Requires SDK 57 Expo Go and a running Metro at IPv4 localhost:8081.
# Fresh Asobana save; iPhone 17 / 17 Pro portrait (402x874 pt).
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
# Simulator/Expo Go prompts on fresh installs and cold starts; not app UI.
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    id: xmark
    optional: true
- extendedWaitUntil:
    visible:
      id: path-current
    timeout: 60000
- assertVisible:
    id: tab-journey
- assertVisible: '100 მონეტა'
- takeScreenshot: artifacts/ios-journey
- tapOn:
    id: path-current
- extendedWaitUntil:
    visible: 'შეაერთე ასოები'
    timeout: 15000
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- takeScreenshot: artifacts/ios-level-1
