# Requires SDK 57 Expo Go and a running Metro at IPv4 localhost:8081.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'ქართული სიტყვები'
    timeout: 60000
- takeScreenshot: artifacts/ios-home
- tapOn: 'გაგრძელება · Continue'
- extendedWaitUntil:
    visible: 'შეაერთე ასოები'
    timeout: 15000
- assertVisible: '100 მონეტა · 0/2 სიტყვა · Bonus 0'
- takeScreenshot: artifacts/ios-level-1
