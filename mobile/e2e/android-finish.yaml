# Run after android-drag.yaml / android-duplicate.yaml.
appId: host.exp.Exponent
---
- tapOn:
    id: input-mode
- assertVisible: 'ბორბლით შეყვანა'
- tapOn:
    id: tap-tile-tile-1
- tapOn:
    id: tap-tile-tile-2
- tapOn:
    id: tap-tile-tile-3
- tapOn:
    id: tap-submit
- assertVisible: '125 მონეტა'
# Completion fires the board, then hands off to the victory screen by itself.
- extendedWaitUntil:
    visible:
      id: victory-title
    timeout: 10000
- tapOn:
    id: victory-next
- assertVisible: 'ოჯახი'
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- assertVisible: '125 მონეტა'
- runFlow: android-restart.yaml
