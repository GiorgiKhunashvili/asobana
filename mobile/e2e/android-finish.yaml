- assertVisible: '125 მონეტა · 2/2 სიტყვა · Bonus 0'
- tapOn: 'გილოცავ! · Victory'
- tapOn: 'შემდეგი დონე · Next level'
- assertVisible: 'ოჯახი'
- assertVisible: '125 მონეტა · 0/2 სიტყვა · Bonus 0'
