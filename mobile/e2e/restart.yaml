# Run after family-partial.yaml. Does not clear Expo Go or the project's SQLite.
appId: host.exp.Exponent
---
- stopApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: 'ქართული სიტყვები'
    timeout: 30000
- assertVisible: '113 მონეტა · Coins'
- tapOn: 'გაგრძელება · Continue'
- assertVisible: 'ოჯახი'
- assertVisible: '113 მონეტა · 1/2 სიტყვა · Bonus 1'
- takeScreenshot: artifacts/ios-restart-restored
- scrollUntilVisible:
    element: 'Tap mode'
    direction: DOWN
    centerElement: true
- tapOn:
    text: 'Tap mode'
    retryTapIfNoChange: true
- assertVisible: 'Swipe mode'
- scrollUntilVisible:
    element: 'Submit'
    direction: DOWN
- tapOn: 'მ · 5'
- tapOn: 'ა · 4'
- tapOn: 'მ · 7'
- tapOn: 'ა · 6'
- tapOn: 'Submit'
- assertVisible: '138 მონეტა · 2/2 სიტყვა · Bonus 1'
- tapOn: 'გილოცავ! · Victory'
- tapOn: 'შემდეგი დონე · Next level'
- assertVisible: 'სახლი'
- assertVisible: '138 მონეტა · 0/2 სიტყვა · Bonus 0'
- takeScreenshot: artifacts/ios-chapter-2-unlocked
