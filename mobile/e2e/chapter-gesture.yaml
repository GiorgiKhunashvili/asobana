# Level ka-003 after restart.yaml. Tiles on the 402x874 pt wheel: კ top,
# ა upper right, რ lower right, ი lower left, ნ upper left.
appId: host.exp.Exponent
---
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- swipe:
    start: 50%, 54%
    end: 80%, 64%
    duration: 700
- assertVisible: 'კა, ეს სიტყვა აქ არ არის'
- assertVisible: '138 მონეტა'
# A drag starting on empty wheel space must not select letters.
- swipe:
    start: 50%, 69%
    end: 50%, 40%
    duration: 700
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- tapOn:
    id: input-mode
- assertVisible: 'ბორბლით შეყვანა'
- assertVisible:
    id: tap-submit
