# Run after answer-feedback.yaml. Tile IDs come from the level content, so
# repeated letters (დ, ა, მ) are addressed unambiguously.
appId: host.exp.Exponent
---
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: path-current
    timeout: 30000
- tapOn:
    id: path-current
- assertVisible: '0/2 სიტყვა · ბონუსი 0'
- tapOn:
    id: input-mode
- assertVisible: 'ბორბლით შეყვანა'
- tapOn:
    id: tap-tile-tile-5
- tapOn:
    id: tap-tile-tile-4
- tapOn:
    id: tap-tile-tile-1
- tapOn:
    id: tap-tile-tile-6
- tapOn:
    id: tap-submit
- assertVisible: 'მადა, ბონუს სიტყვა +3'
- assertVisible: '0/2 სიტყვა · ბონუსი 1'
- assertVisible: '128 მონეტა'
- tapOn:
    id: hint-cell
- assertVisible: '113 მონეტა'
- tapOn:
    id: tap-tile-tile-1
- tapOn:
    id: tap-tile-tile-2
- tapOn:
    id: tap-tile-tile-3
- tapOn:
    id: tap-tile-tile-4
- tapOn:
    id: tap-submit
- assertVisible: '1/2 სიტყვა · ბონუსი 1'
- assertVisible: '113 მონეტა'
- takeScreenshot: artifacts/ios-family-partial
